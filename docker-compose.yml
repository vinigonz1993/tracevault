services:
  postgres:
    image: postgres:16
    container_name: tracevault-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: tracevault
      POSTGRES_PASSWORD: tracevault
      POSTGRES_DB: tracevault

    ports:
      - "5432:5432"

    volumes:
      - tracevault_postgres:/var/lib/postgresql/data


volumes:
  tracevault_postgres: